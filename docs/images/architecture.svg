<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>청도 코스 메이커 배포 아키텍처</title>
  <desc>사용자는 Azure 공용 IP와 NSG를 거쳐 VM의 nginx(web)로 들어오고, nginx가 /api 요청을 Express(api)로 넘긴다. api는 spots.json을 메모리에 올려 planDay로 하루 일정을 계산한다. Terraform이 Azure 리소스를 만들고, VM 첫 부팅 때 cloud-init이 GitHub 저장소를 받아 Docker Compose로 빌드 · 실행한다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#FFFFFF"/>

  <!-- 사용자 -->
  <rect x="30" y="215" width="160" height="70" rx="10" fill="#F1EFE8" stroke="#888780"/>
  <text x="110" y="244" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">사용자 브라우저</text>
  <text x="110" y="266" text-anchor="middle" font-size="12" fill="#5F5E5A">PC · 모바일</text>

  <!-- Azure -->
  <rect x="230" y="30" width="600" height="500" rx="16" fill="#F4F8FC" stroke="#185FA5"/>
  <text x="252" y="58" font-size="15" font-weight="600" fill="#0C447C">Azure · rg-cheongdo-course (koreacentral)</text>

  <rect x="260" y="76" width="540" height="58" rx="10" fill="#FFFFFF" stroke="#378ADD"/>
  <text x="530" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">고정 공용 IP · DNS  →  NSG</text>
  <text x="530" y="121" text-anchor="middle" font-size="12" fill="#185FA5">80 · 443 공개 / 22(SSH)는 관리자 IP만</text>

  <rect x="260" y="156" width="540" height="350" rx="12" fill="#EEF7F1" stroke="#3B6D11"/>
  <text x="430" y="183" font-size="14" font-weight="600" fill="#27500A">VM · Ubuntu 24.04 · Docker Compose</text>

  <rect x="290" y="205" width="220" height="96" rx="10" fill="#F1EFFE" stroke="#534AB7"/>
  <text x="400" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">web · nginx :80</text>
  <text x="400" y="255" text-anchor="middle" font-size="12" fill="#534AB7">React 정적 파일 · SPA 라우팅</text>
  <text x="400" y="275" text-anchor="middle" font-size="12" fill="#534AB7">캐시 · 압축 · 보안 헤더</text>

  <rect x="550" y="205" width="220" height="96" rx="10" fill="#F1EFFE" stroke="#534AB7"/>
  <text x="660" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">api · Express :3000</text>
  <text x="660" y="255" text-anchor="middle" font-size="12" fill="#534AB7">zod 검증 · planDay</text>
  <text x="660" y="275" text-anchor="middle" font-size="12" fill="#534AB7">외부 비공개 (내부 네트워크)</text>

  <rect x="550" y="335" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#534AB7"/>
  <text x="660" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">spots.json</text>
  <text x="660" y="384" text-anchor="middle" font-size="12" fill="#534AB7">43곳 · 시작 시 메모리 로드</text>

  <rect x="290" y="335" width="220" height="126" rx="10" fill="#FFF6E5" stroke="#BA7517"/>
  <text x="400" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">cloud-init (첫 부팅)</text>
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#854F0B">스왑 2GB · Docker 설치</text>
  <text x="400" y="405" text-anchor="middle" font-size="12" fill="#854F0B">git clone (main)</text>
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#854F0B">compose build · up</text>
  <text x="400" y="445" text-anchor="middle" font-size="12" fill="#854F0B">APP_VERSION = 커밋</text>

  <!-- 오른쪽: IaC · 소스 -->
  <rect x="870" y="76" width="200" height="112" rx="10" fill="#FFF6E5" stroke="#BA7517"/>
  <text x="970" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Terraform (azurerm)</text>
  <text x="970" y="128" text-anchor="middle" font-size="12" fill="#854F0B">terraform apply</text>
  <text x="970" y="148" text-anchor="middle" font-size="12" fill="#854F0B">RG · VNet · NSG</text>
  <text x="970" y="168" text-anchor="middle" font-size="12" fill="#854F0B">공용 IP · VM 생성</text>

  <rect x="870" y="335" width="200" height="70" rx="10" fill="#F1EFE8" stroke="#888780"/>
  <text x="970" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">GitHub 저장소</text>
  <text x="970" y="384" text-anchor="middle" font-size="12" fill="#5F5E5A">소스 · Dockerfile · compose</text>

  <!-- 화살표 -->
  <path d="M190 250 H222 V105 H256" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M400 134 V201" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="408" y="150" font-size="12" fill="#5F5E5A">HTTP</text>
  <path d="M510 253 H546" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="514" y="243" font-size="12" fill="#5F5E5A">/api/*</text>
  <path d="M660 301 V331" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M400 335 V305" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="408" y="325" font-size="12" fill="#854F0B">빌드 · 실행</text>
  <path d="M870 132 H834" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M970 405 V482 H400 V465" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="790" y="476" font-size="12" fill="#5F5E5A">git clone</text>
</svg>
